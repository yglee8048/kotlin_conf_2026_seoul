# 8~12단계용 프로파일.
#
#   ./gradlew bootRun --args='--spring.profiles.active=vt'
#
# 이 파일이 하는 일은 한 줄뿐이다. **애플리케이션 코드는 한 글자도 바뀌지 않는다.**
# 그게 8단계에서 하고 싶은 말의 전부다.
#
# 켜지는 것:
# - 톰캣이 요청마다 가상 스레드를 만든다 (`http-nio-8080-exec-N` -> `tomcat-handler-N`, 로그의 P -> V)
# - Spring 이 만드는 applicationTaskExecutor / taskScheduler 도 가상 스레드 기반이 된다
#
# 켜지지 **않는** 것 (직접 만든 것이라 Boot 가 손대지 않는다):
# - AsyncConfig / ContextAwareAsyncConfig 의 ThreadPoolTaskExecutor 들은 그대로 플랫폼 스레드다.
#   그래서 vt 프로파일에서도 v2/v3 의 worker 로그는 `P[home-info-1]` 로 찍힌다.
#   "톰캣만 가상 스레드가 되었을 뿐, 내가 만든 풀은 내가 바꿔야 한다" 를 보여주는 지점이다.
#   10단계에서 이 풀들을 가상 스레드 dispatcher 로 갈아치운다.
spring:
  threads:
    virtual:
      enabled: true
